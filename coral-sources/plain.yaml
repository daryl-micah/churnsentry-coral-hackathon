# Plain — custom Coral source
#
# Register with:  coral source add ./coral-sources/plain.yaml
# Query with:    coral sql "SELECT * FROM plain.threads LIMIT 5"
#
# Replaces Intercom as ChurnSentry's customer-support signal. Plain has a free
# tier and a clean GraphQL API. We expose threads (support tickets), customers,
# and customer-timeline events as queryable tables.

source:
  name: plain
  version: 1
  description: Plain support threads, customers, and timeline events (GraphQL)

config:
  api_key:
    env: PLAIN_API_KEY
    required: true
    description: API key (Settings → API keys → "Read customers, threads, events")
  endpoint:
    env: PLAIN_API_ENDPOINT
    default: https://core-api.uk.plain.com/graphql/v1
    description: Plain GraphQL endpoint (uk or us region)

auth:
  type: bearer
  token: "{{ config.api_key }}"

transport:
  type: graphql
  endpoint: "{{ config.endpoint }}"

tables:
  # ─── Threads (support tickets) ─────────────────────────────
  - name: threads
    description: Support threads — Plain's equivalent of Intercom conversations
    query: |
      query ChurnsentryThreads($first: Int!, $after: String) {
        threads(first: $first, after: $after) {
          edges {
            node {
              id
              title
              status
              statusChangedAt { iso8601 }
              priority
              createdAt { iso8601 }
              updatedAt { iso8601 }
              customer { id email { email } fullName }
              assignedTo { ... on User { id fullName } }
              labels { labelType { name } }
            }
          }
          pageInfo { hasNextPage endCursor }
        }
      }
    pagination:
      type: cursor
      first_var: first
      cursor_var: after
      page_size: 50
      cursor_path: data.threads.pageInfo.endCursor
      has_next_path: data.threads.pageInfo.hasNextPage
    response_path: data.threads.edges[*].node
    columns:
      - { name: id,                type: string,    json: id }
      - { name: title,             type: string,    json: title }
      - { name: status,            type: string,    json: status,                    description: TODO | SNOOZED | DONE }
      - { name: status_changed_at, type: timestamp, json: statusChangedAt.iso8601 }
      - { name: priority,          type: integer,   json: priority,                  description: 0 (urgent) – 3 (low) }
      - { name: created_at,        type: timestamp, json: createdAt.iso8601 }
      - { name: updated_at,        type: timestamp, json: updatedAt.iso8601 }
      - { name: customer_id,       type: string,    json: customer.id }
      - { name: customer_email,    type: string,    json: customer.email.email }
      - { name: customer_name,     type: string,    json: customer.fullName }
      - { name: assignee_id,       type: string,    json: assignedTo.id }
      - { name: assignee_name,     type: string,    json: assignedTo.fullName }

  # ─── Customers ─────────────────────────────────────────────
  - name: customers
    description: Plain customers (one row per identified user)
    query: |
      query ChurnsentryCustomers($first: Int!, $after: String) {
        customers(first: $first, after: $after) {
          edges {
            node {
              id
              fullName
              shortName
              email { email isVerified }
              externalId
              createdAt { iso8601 }
              updatedAt { iso8601 }
            }
          }
          pageInfo { hasNextPage endCursor }
        }
      }
    pagination:
      type: cursor
      first_var: first
      cursor_var: after
      page_size: 100
      cursor_path: data.customers.pageInfo.endCursor
      has_next_path: data.customers.pageInfo.hasNextPage
    response_path: data.customers.edges[*].node
    columns:
      - { name: id,           type: string,    json: id }
      - { name: full_name,    type: string,    json: fullName }
      - { name: short_name,   type: string,    json: shortName }
      - { name: email,        type: string,    json: email.email }
      - { name: email_verified, type: boolean, json: email.isVerified }
      - { name: external_id,  type: string,    json: externalId }
      - { name: created_at,   type: timestamp, json: createdAt.iso8601 }
      - { name: updated_at,   type: timestamp, json: updatedAt.iso8601 }

  # ─── Events (customer timeline) ────────────────────────────
  - name: events
    description: Customer timeline entries (note, email, thread updates, custom events)
    query: |
      query ChurnsentryEvents($first: Int!, $after: String) {
        timelineEntries(first: $first, after: $after) {
          edges {
            node {
              id
              timestamp { iso8601 }
              actor { ... on UserActor { user { id fullName } } }
              customer { id email { email } }
              entry { __typename }
            }
          }
          pageInfo { hasNextPage endCursor }
        }
      }
    pagination:
      type: cursor
      first_var: first
      cursor_var: after
      page_size: 100
      cursor_path: data.timelineEntries.pageInfo.endCursor
      has_next_path: data.timelineEntries.pageInfo.hasNextPage
    response_path: data.timelineEntries.edges[*].node
    columns:
      - { name: id,             type: string,    json: id }
      - { name: timestamp,      type: timestamp, json: timestamp.iso8601 }
      - { name: actor_id,       type: string,    json: actor.user.id }
      - { name: actor_name,     type: string,    json: actor.user.fullName }
      - { name: customer_id,    type: string,    json: customer.id }
      - { name: customer_email, type: string,    json: customer.email.email }
      - { name: entry_type,     type: string,    json: entry.__typename, description: e.g. ThreadCreatedEntry, NoteEntry, EmailEntry }
